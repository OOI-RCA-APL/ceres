name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: "3.10"
          architecture: x64
      - uses: snok/install-poetry@v1
        with:
          version: 1.1.15
      - name: Install
        working-directory: ./ceres
        run: poetry install
      - name: Lint
        working-directory: ./ceres
        run: poetry run task lint
