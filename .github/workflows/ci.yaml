name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    services:
      # Production runs on PostgreSQL while most tests exercise SQLite, so migration SQL that is
      # only valid on one backend can pass everything else. The migration tests connect here and
      # skip themselves when no server is reachable.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ceres
          POSTGRES_PASSWORD: ceres
          POSTGRES_DB: ceres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CERES_TEST_POSTGRES_URL: postgresql+asyncpg://ceres:ceres@localhost:5432/ceres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ">=24.0.0"
      - name: Install UV
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Ensure Generated Files Match
        run: git diff --exit-code -- ':!**/package-lock.json'
