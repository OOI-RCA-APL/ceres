name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The release workflow runs these same checks as its gate before building wheels, so the
  # two cannot drift apart.
  workflow_call:
jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    services:
      # Production runs on PostgreSQL while most tests exercise SQLite, so SQL that is only valid
      # on one backend could otherwise pass everything else. Tests carrying the `databases` marker
      # run against every backend, including this one, and skip it when no server is reachable.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ceres
          POSTGRES_PASSWORD: ceres
          POSTGRES_DB: ceres
          # The suite asserts specific orderings, and text ordering follows the database's
          # collation. `C` sorts by byte, which is what SQLite does, so every backend agrees.
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        # The data directory is a tmpfs because nothing here outlives the job. The suite commits
        # constantly and runs the schema through a full migration chain per test, so every commit
        # would otherwise wait on the runner's disk to store data that is thrown away at the end.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U ceres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CERES_TEST_POSTGRES_URL: postgresql+asyncpg://ceres:ceres@localhost:5432/ceres
      # Nothing here needs an optimized build, and the release profile is most of the run.
      PROFILE: dev
      # A cold one-shot build pays incremental's overhead and caches its output for nobody.
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Pinned exactly, because the console bundle is compared byte for byte against the
      # committed one and a different Node can change what the bundler emits.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: console/.nvmrc
      - name: Install UV
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      # No explicit Rust install. The preinstalled rustup resolves rust-toolchain.toml on
      # the first cargo command, fetching the pinned nightly and its components, so the
      # pin lives in exactly one place.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # The action keys on the lockfile and the toolchain, so a profile or flag change
          # reuses a key that already exists, and a cache entry cannot be overwritten.
          key: ${{ hashFiles('rust/Cargo.toml', '.cargo/config.toml') }}
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      # Ahead of the tests, because a migration that changed the schema without recording
      # it fails here in seconds and there in minutes, saying the same thing either way.
      # This refuses a backend it cannot reach as well as one that has drifted, so the
      # three files are checked or the step fails rather than quietly covering two.
      - name: Check Recorded Schema
        run: make schema-check
      # The check hashes the source and test files rather than rerunning the suites, so a
      # change that could move the numbers fails in seconds until `make coverage` records
      # fresh tables.
      - name: Check Recorded Coverage
        run: make coverage-check
      # The reference pages are rendered from the configuration schema, the command tree,
      # the API document, and the package's exports, so a surface that moved without the
      # pages moving with it fails here.
      - name: Check Generated Reference
        run: make reference-check
      # The wheel ships the committed bundle as it stands, so a frontend change that was
      # never rebuilt would release a stale console.
      - name: Check Generated Console
        run: make console-check
      # The service test drives the runner's own systemd user manager. Linger is what
      # starts that manager, and doing it here stands in for the polkit approval the test
      # user cannot grant itself.
      - name: Enable Systemd User Session
        run: sudo loginctl enable-linger "$(whoami)"
      - name: Test
        run: make test
        env:
          CERES_SERVICE_TEST: "1"
      - name: Build
        run: make build
      # A build that exhausts the runner's disk fails in ways that look unrelated, and the
      # core count is what bounds how far the suites can be parallelized.
      - name: Report Runner Resources
        run: |
          nproc
          free -h
          df -h /
      - name: Ensure Generated Files Match
        run: git diff --exit-code -- ':!**/package-lock.json'
