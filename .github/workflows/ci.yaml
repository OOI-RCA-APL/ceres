name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          architecture: x64
          cache: "poetry"
      - name: Install
        working-directory: ./ceres
        run: poetry install
      - name: Lint
        working-directory: ./ceres
        run: poetry run task lint
