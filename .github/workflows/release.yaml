name: release
# Wheels build only when a release is published, never on push. A release is rare and
# deliberate, so the expensive multi-platform matrix spends nothing between releases.
on:
  release:
    types: [published]
  # Rebuilding a tag that already published, for when a platform's wheel is missing from an
  # otherwise good release. Both destinations skip what they already hold, so a rebuild adds
  # the missing files and leaves the rest untouched. A dry run builds every artifact from
  # the dispatched ref and publishes none of them, which proves a build change before a
  # release depends on it.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to rebuild, or empty for a dry run of the ref.
        required: false
      dry_run:
        description: Build every artifact without checking the version or publishing.
        type: boolean
        default: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  # The release must agree with the repository about what version it is, and the version
  # must have a changelog entry. Failing here costs seconds, failing in the build matrix
  # costs the whole matrix.
  version:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check Tag Matches Project Version
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Check Changelog Has an Entry
        run: |
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $TAG"
            exit 1
          fi

  # The same lint and test gates as CI, via workflow_call, so a release cannot build from
  # a commit the ordinary checks would have rejected.
  check:
    needs: version
    uses: ./.github/workflows/ci.yaml

  # The console bundle is untracked, so every artifact below takes it from here rather
  # than from the checkout. Built once and shared, because the bundler splits chunks
  # differently per platform and one bundle per release keeps every wheel identical.
  console:
    needs: version
    # A dry run skips the version check, and a skipped need skips its dependents unless
    # the condition asks only that nothing failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: console/.nvmrc
      - name: Build the Console
        run: cd console && npm ci && npm run build
      - name: Upload the Console
        uses: actions/upload-artifact@v7
        with:
          name: console
          path: ceres/static/console

  # One job per platform, each emitting wheels for every interpreter. The native CLI
  # binary builds as an artifact dependency of the extension, compiled for the same
  # target inside the same cargo invocation, and `ceres-core`'s build script stages it
  # into the wheel data directory. The directory is created up front because maturin
  # only honors it when it exists before the build starts.
  build:
    needs: [check, console]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          # Cross-compiled from the arm runner, so macOS needs one runner, not two.
          - os: macos-15
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The wheel serves these, and the checkout carries none, the bundle being untracked.
      - name: Download the Console
        uses: actions/download-artifact@v8
        with:
          name: console
          path: ceres/static/console
      # Installed one at a time so each reports where it landed. Windows has no
      # `python3.14t` on the path, only `python.exe`, so a version selector there resolves
      # to whichever install came last and both wheels build against the same interpreter.
      - name: Install Python
        id: standard
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Free-Threaded Python
        id: freethreaded
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      # Restores what the `cache` workflow saved on the default branch. Saving is off
      # because this run is on a tag, so anything it wrote would be readable only by that
      # tag and never by the next release.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Includes what the action's own key does not hash, so a profile or flag change
          # lands under a fresh key rather than being refused as an immutable duplicate.
          key: ${{ matrix.target }}-${{ hashFiles('rust/Cargo.toml', '.cargo/config.toml') }}
          save-if: false
      - name: Create Wheel Data Directory
        shell: bash
        run: mkdir -p ceres.__internal__.core.data/scripts
      - name: Install the FFmpeg Toolchain
        uses: ./.github/actions/ffmpeg-toolchain
      - name: Build Wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # The manylinux container carries its own interpreters, so Linux has to select by
          # version rather than by a path that exists only on the runner outside it.
          args: --release --out dist --interpreter ${{ runner.os == 'Windows' && format('{0} {1}', steps.standard.outputs.python-path, steps.freethreaded.outputs.python-path) || '3.14 3.14t' }}
          manylinux: auto
      - name: Check Every Interpreter Produced a Wheel
        shell: bash
        # maturin builds for the interpreters it finds rather than the ones it was asked
        # for, and reports success either way, so a selector that resolves twice to the
        # same interpreter ships a release missing a platform.
        run: |
          count="$(ls dist/*.whl | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "Expected a wheel per interpreter, found $count:"
            ls dist
            exit 1
          fi
      - name: Smoke Test
        # A cross-compiled wheel cannot import on this runner, so only wheels matching
        # the runner's own architecture install and run here.
        if: matrix.cross != true
        shell: bash
        env:
          STANDARD: ${{ steps.standard.outputs.python-path }}
          FREETHREADED: ${{ steps.freethreaded.outputs.python-path }}
        # Every interpreter installs and runs its own wheel, so one that builds but cannot
        # import fails here. The first install refuses the index, because a version being
        # rebuilt is already published and would otherwise satisfy this from PyPI.
        run: |
          for python in "$STANDARD" "$FREETHREADED"; do
            "$python" -m pip install --no-index --no-deps --find-links dist ceres-engine
            "$python" -m pip install --find-links dist ceres-engine
            "$python" -c "import ceres; print(ceres.__name__, 'imports')"
            # Reads the distribution metadata, which names the wheel rather than the import
            # package and has no checkout to fall back on once installed.
            "$python" -c "from ceres.version import __version__; print(__version__)"
            "$python" -m ceres --version
          done
      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  # The sdist is the source of record and the fallback for platforms outside the matrix.
  # Building from it compiles the extension but stages no CLI binary, so those installs
  # use `python -m ceres`.
  sdist:
    needs: [check, console]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The sdist carries the bundle prebuilt, so a source install needs no Node at all,
      # and taking the same one the wheels take keeps every artifact's console identical.
      - name: Download the Console
        uses: actions/download-artifact@v8
        with:
          name: console
          path: ceres/static/console
      # The marker rides in the sdist so extracting it creates the wheel data directory,
      # which maturin requires to exist before a build starts. The extension's build
      # script replaces it with the CLI binary.
      - name: Create Wheel Data Marker
        run: mkdir -p ceres.__internal__.core.data/scripts && touch ceres.__internal__.core.data/scripts/.keep
      - name: Build Sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload Sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  # The wheels and sdist also attach to the GitHub release itself, which is what the
  # Pages package index links against, so installs resolve from GitHub with no PyPI
  # involved. The `ceres` alias wheel is built here too, a pure-Python shim pinning
  # `ceres-engine`, so the bare name resolves on that index from the one build matrix.
  # Separate from the publish job so neither destination blocks the other, and the
  # alias stays off PyPI, where only `ceres-engine` publishes.
  attach:
    needs: [build, sdist]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.2.0
      # Named rather than taking everything, the console bundle riding alongside the
      # distributions as an artifact of its own and belonging in neither destination.
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Build the Alias Wheel
        run: python3 scripts/build-alias-wheel.py "$TAG" dist
      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo '${{ github.repository }}'

  publish:
    needs: [build, sdist]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing exchanges this token with PyPI, so no long-lived secret exists.
      id-token: write
    steps:
      # Named rather than taking everything, the console bundle riding alongside the
      # distributions as an artifact of its own and belonging in neither destination.
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A version's files are immutable but its file list is not, so a rebuild adds
          # what is missing and passes over what is already published.
          skip-existing: true
