          type: object
        hashing:
          discriminator:
            mapping:
              argon2: '#/components/schemas/Argon2HashingConfig'
              bcrypt: '#/components/schemas/BCryptHashingConfig'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/BCryptHashingConfig'
          - $ref: '#/components/schemas/Argon2HashingConfig'
