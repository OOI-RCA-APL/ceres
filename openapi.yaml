          type: string
      required:
      - secret
      title: ServerAuthenticationConfig
      type: object
    ServerConfig:
      additionalProperties: false
      properties:
        authentication:
          anyOf:
          - $ref: '#/components/schemas/ServerAuthenticationConfig'
