components:
  schemas:
    APIComponent:
      additionalProperties: false
      properties:
        address:
          title: Address
          type: string
        components:
          items:
            $ref: '#/components/schemas/APIComponent'
          title: Components
          type: array
        name:
          pattern: ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$
          title: Name
          type: string
        procedures:
          items:
            anyOf:
            - $ref: '#/components/schemas/QueryBinding'
            - $ref: '#/components/schemas/ActionBinding'
          title: Procedures
          type: array
        roles:
          items:
            $ref: '#/components/schemas/ComponentRole'
          title: Roles
          type: array
      required:
      - name
      - address
      - components
      - roles
      - procedures
      title: Component
      type: object
    APIIdentity:
      additionalProperties: false
      properties:
        expires:
          format: date-time
          title: Expires
          type: string
        token:
          title: Token
          type: string
        user:
          $ref: '#/components/schemas/APIUser'
      required:
      - user
      - token
      - expires
      title: Identity
      type: object
    APIUser:
      additionalProperties: false
      properties:
        disabled:
          title: Disabled
          type: boolean
        email:
          format: email
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        username:
          maxLength: 64
          minLength: 1
          pattern: '[a-zA-Z\-_]+'
          title: Username
          type: string
      required:
      - id
      - username
      - email
      - role
      - disabled
      title: User
      type: object
    ActionBinding:
      additionalProperties: false
      properties:
        arguments:
          anyOf:
          - $ref: '#/components/schemas/ProcedureArgumentsInfo'
          - type: 'null'
        live:
          title: Live
          type: boolean
        method:
          title: Method
          type: string
        name:
          pattern: ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$
          title: Name
          type: string
        output:
          $ref: '#/components/schemas/ProcedureOutputInfo'
        type:
          const: action
          default: action
          title: Type
      required:
      - name
      - method
      - live
      - arguments
      - output
      title: ActionBinding
      type: object
    Alert:
      additionalProperties: false
      properties:
        address:
          title: Address
          type: string
        code:
          title: Code
          type: string
        id:
          format: uuid
          title: Id
          type: string
        info:
          title: Info
          type: object
        level:
          $ref: '#/components/schemas/Level'
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - address
      - level
      - code
      title: Alert
      type: object
    AlertOrder:
      enum:
      - old-to-new
      - new-to-old
      title: AlertOrder
      type: string
    AlertStatistics:
      additionalProperties: false
      properties:
        count:
          default: 0
          title: Count
          type: integer
        levels:
          items:
            $ref: '#/components/schemas/LevelStatistics'
          title: Levels
          type: array
      title: AlertStatistics
      type: object
    AlreadyExistsError:
      title: AlreadyExistsError
    Argon2HashingConfig:
      additionalProperties: false
      properties:
        hash_length:
          default: 32
          maximum: 256.0
          minimum: 4.0
          title: Hash Length
          type: integer
        memory_cost:
          default: 65536
          minimum: 8.0
          title: Memory Cost
          type: integer
        parallelism:
          default: 4
          exclusiveMinimum: 0.0
          title: Parallelism
          type: integer
        salt_length:
          default: 16
          maximum: 64.0
          minimum: 8.0
          title: Salt Length
          type: integer
        time_cost:
          default: 3
          exclusiveMinimum: 0.0
          title: Time Cost
          type: integer
        type:
          const: argon2
          default: argon2
          title: Type
      title: Argon2HashingConfig
      type: object
    AuthorizationCookieType:
      enum:
      - insecure
      - secure
      title: AuthorizationCookieType
      type: string
    BCryptHashingConfig:
      additionalProperties: false
      properties:
        rounds:
          default: 12
          exclusiveMinimum: 0.0
          title: Rounds
          type: integer
        type:
          const: bcrypt
          default: bcrypt
          title: Type
      title: BCryptHashingConfig
      type: object
    BadCredentialsError:
      title: BadCredentialsError
    Body_get_users_api_users_get:
      properties:
        email:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Email
        id:
          anyOf:
          - format: uuid
            type: string
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          title: Id
        role:
          anyOf:
          - $ref: '#/components/schemas/UserRole'
          - items:
              $ref: '#/components/schemas/UserRole'
            type: array
          - type: 'null'
          title: Role
        username:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Username
      title: Body_get_users_api_users_get
      type: object
    ChangePasswordInput:
      additionalProperties: false
      properties:
        new_password:
          maxLength: 32
          minLength: 1
          title: New Password
          type: string
        old_password:
          minLength: 1
          title: Old Password
          type: string
      required:
      - old_password
      - new_password
      title: ChangePasswordInput
      type: object
    ComponentConfig:
      additionalProperties: false
      properties:
        arguments:
          title: Arguments
          type: object
        class:
          title: Class
        components:
          items:
            $ref: '#/components/schemas/ComponentConfig'
          title: Components
          type: array
        jobs:
          items:
            $ref: '#/components/schemas/JobConfig'
          title: Jobs
          type: array
        name:
          pattern: ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$
          title: Name
          type: string
      required:
      - name
      title: ComponentConfig
      type: object
    ComponentFilter:
      properties:
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        root:
          default: '@'
          title: Root
          type: string
        running:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Running
      title: ComponentFilter
      type: object
    ComponentInitExceptionError:
      title: ComponentInitExceptionError
    ComponentJobInvalidError:
      title: ComponentJobInvalidError
    ComponentReferenceInvalidError:
      title: ComponentReferenceInvalidError
    ComponentRole:
      enum:
      - connection
      - interface
      title: ComponentRole
      type: string
    Config:
      additionalProperties: false
      properties:
        arguments:
          title: Arguments
          type: object
        class:
          title: Class
        components:
          items:
            $ref: '#/components/schemas/ComponentConfig'
          title: Components
          type: array
        console:
          $ref: '#/components/schemas/ConsoleConfig'
        database:
          discriminator:
            mapping:
              postgres: '#/components/schemas/PostgresDatabaseConfig'
              sqlite: '#/components/schemas/SQLiteDatabaseConfig'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/SQLiteDatabaseConfig'
          - $ref: '#/components/schemas/PostgresDatabaseConfig'
          title: Database
        jobs:
          items:
            $ref: '#/components/schemas/JobConfig'
          title: Jobs
          type: array
        name:
          default: root
          pattern: ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$
          title: Name
          type: string
        server:
          $ref: '#/components/schemas/ServerConfig'
        service:
          $ref: '#/components/schemas/ServiceConfig'
      title: Config
      type: object
    ConfigComponentError:
      title: ConfigComponentError
    ConfigDatabaseError:
      title: ConfigDatabaseError
    ConfigNotProvidedError:
      title: ConfigNotProvidedError
    ConfigParseError:
      title: ConfigParseError
    ConfigParseErrorLocation:
      additionalProperties: false
      properties:
        column:
          title: Column
          type: integer
        line:
          title: Line
          type: integer
      required:
      - line
      - column
      title: ConfigParseErrorLocation
      type: object
    ConfigReadError:
      title: ConfigReadError
    ConfigValidationError:
      title: ConfigValidationError
    Connectivity:
      enum:
      - disconnected
      - connecting
      - connected
      title: Connectivity
      type: string
    ConsoleConfig:
      additionalProperties: false
      properties:
        dashboard:
          anyOf:
          - type: string
          - type: 'null'
          title: Dashboard
        favicon:
          anyOf:
          - format: path
            type: string
          - type: 'null'
          title: Favicon
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: ConsoleConfig
      type: object
    CronSchedule:
      additionalProperties: false
      properties:
        crontab:
          title: Crontab
          type: string
        type:
          const: cron
          default: cron
          title: Type
      required:
      - crontab
      title: CronSchedule
      type: object
    DatabaseConfigHooks:
      additionalProperties: false
      properties:
        close:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Close
        connect:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Connect
        init:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Init
      title: DatabaseConfigHooks
      type: object
    DatabaseRetryConfig:
      additionalProperties: false
      properties:
        interval:
          default: PT3S
          format: duration
          title: Interval
          type: string
        timeout:
          default: PT15S
          format: duration
          title: Timeout
          type: string
      title: DatabaseRetryConfig
      type: object
    DisableResult:
      additionalProperties: false
      properties:
        disabled:
          items:
            type: string
          title: Disabled
          type: array
      required:
      - disabled
      title: DisableResult
      type: object
    DownResult:
      additionalProperties: false
      properties:
        disabled:
          items:
            type: string
          title: Disabled
          type: array
        stopped:
          items:
            type: string
          title: Stopped
          type: array
      required:
      - disabled
      - stopped
      title: DownResult
      type: object
    EnableResult:
      additionalProperties: false
      properties:
        enabled:
          items:
            type: string
          title: Enabled
          type: array
      required:
      - enabled
      title: EnableResult
      type: object
    ? Fail_Union_ProcedureComponentNotFoundError__ProcedureNotFoundError__ProcedureNotPermittedError__ProcedureComponentNotLoadedError__ProcedureInvalidArgumentsError__ProcedureNotSubscribableError__ProcedureCancelledError__ProcedureInternalError__
    : additionalProperties: false
      properties:
        error:
          anyOf:
          - $ref: '#/components/schemas/ProcedureComponentNotFoundError'
          - $ref: '#/components/schemas/ProcedureNotFoundError'
          - $ref: '#/components/schemas/ProcedureNotPermittedError'
          - $ref: '#/components/schemas/ProcedureComponentNotLoadedError'
          - $ref: '#/components/schemas/ProcedureInvalidArgumentsError'
          - $ref: '#/components/schemas/ProcedureNotSubscribableError'
          - $ref: '#/components/schemas/ProcedureCancelledError'
          - $ref: '#/components/schemas/ProcedureInternalError'
          title: Error
        ok:
          const: false
          default: false
          title: Ok
      required:
      - error
      title: Fail[Union[ProcedureComponentNotFoundError, ProcedureNotFoundError, ProcedureNotPermittedError,
        ProcedureComponentNotLoadedError, ProcedureInvalidArgumentsError, ProcedureNotSubscribableError,
        ProcedureCancelledError, ProcedureInternalError]]
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IntervalSchedule:
      additionalProperties: false
      properties:
        end:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End
        interval:
          format: duration
          title: Interval
          type: string
        max:
          anyOf:
          - format: duration
            type: string
          - type: 'null'
          title: Max
        min:
          anyOf:
          - format: duration
            type: string
          - type: 'null'
          title: Min
        multiplier:
          default: 1
          exclusiveMinimum: 0.0
          title: Multiplier
          type: number
        start:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Start
        type:
          const: interval
          default: interval
          title: Type
      required:
      - interval
      title: IntervalSchedule
      type: object
    JobConfig:
      additionalProperties: false
      properties:
        action:
          pattern: ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$
          title: Action
          type: string
        arguments:
          anyOf:
          - patternProperties:
              ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$: {}
            type: object
          - type: 'null'
          title: Arguments
        name:
          pattern: ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$
          title: Name
          type: string
        schedule:
          discriminator:
            mapping:
              cron: '#/components/schemas/CronSchedule'
              interval: '#/components/schemas/IntervalSchedule'
              or: '#/components/schemas/OrSchedule'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/CronSchedule'
          - $ref: '#/components/schemas/IntervalSchedule'
          - $ref: '#/components/schemas/OrSchedule'
          title: Schedule
      required:
      - name
      - action
      - schedule
      title: JobConfig
      type: object
    Level:
      enum:
      - debug
      - info
      - warning
      - error
      - critical
      title: Level
      type: string
    LevelStatistics:
      additionalProperties: false
      properties:
        count:
          minimum: 0.0
          title: Count
          type: integer
        level:
          $ref: '#/components/schemas/Level'
      required:
      - level
      - count
      title: LevelStatistics
      type: object
    LogEntry:
      additionalProperties: false
      properties:
        address:
          title: Address
          type: string
        content:
          title: Content
          type: string
        id:
          format: uuid
          title: Id
          type: string
        level:
          $ref: '#/components/schemas/Level'
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - address
      - level
      - content
      title: LogEntry
      type: object
    LogEntryOrder:
      enum:
      - old-to-new
      - new-to-old
      title: LogEntryOrder
      type: string
    LoginInput:
      additionalProperties: false
      properties:
        cookie:
          anyOf:
          - $ref: '#/components/schemas/AuthorizationCookieType'
          - type: 'null'
        password:
          title: Password
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: LoginInput
      type: object
    LoginResult:
      additionalProperties: false
      properties:
        expires:
          format: date-time
          title: Expires
          type: string
        token:
          title: Token
          type: string
        user:
          $ref: '#/components/schemas/APIUser'
      required:
      - user
      - token
      - expires
      title: LoginResult
      type: object
    MeResult:
      additionalProperties: false
      properties:
        expires:
          format: date-time
          title: Expires
          type: string
        user:
          $ref: '#/components/schemas/APIUser'
      required:
      - user
      - expires
      title: MeResult
      type: object
    Message:
      additionalProperties: false
      properties:
        address:
          title: Address
          type: string
        content:
          title: Content
          type: string
        direction:
          $ref: '#/components/schemas/MessageDirection'
        id:
          format: uuid
          title: Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      required:
      - address
      - direction
      - content
      title: Message
      type: object
    MessageDirection:
      enum:
      - send
      - receive
