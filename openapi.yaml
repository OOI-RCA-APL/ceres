      - password
      title: PostgresDatabaseConfig
      type: object
    ProcedureArgumentsInfo:
      additionalProperties: false
      properties:
        json_schema:
          title: Json Schema
          type: object
        required:
          title: Required
          type: boolean
      required:
      - json_schema
      - required
      title: ProcedureArgumentsInfo
      type: object
    ProcedureCancelledError:
      title: ProcedureCancelledError
    ProcedureComponentNotFoundError:
      title: ProcedureComponentNotFoundError
    ProcedureComponentNotLoadedError:
      title: ProcedureComponentNotLoadedError
    ProcedureInternalError:
      title: ProcedureInternalError
    ProcedureInvalidArgumentsError:
      title: ProcedureInvalidArgumentsError
    ProcedureNotFoundError:
      title: ProcedureNotFoundError
    ProcedureNotPermittedError:
      title: ProcedureNotPermittedError
    ProcedureNotSubscribableError:
      title: ProcedureNotSubscribableError
    ProcedureOutputInfo:
      additionalProperties: false
      properties:
        json_schema:
          title: Json Schema
          type: object
      required:
      - json_schema
      title: ProcedureOutputInfo
      type: object
    QueryBinding:
      additionalProperties: false
      properties:
        arguments:
          anyOf:
          - $ref: '#/components/schemas/ProcedureArgumentsInfo'
          - type: 'null'
        live:
          title: Live
          type: boolean
        method:
          title: Method
          type: string
        name:
          pattern: ^[a-zA-Z_\-][a-zA-Z0-9_\-]*$
          title: Name
          type: string
        output:
          $ref: '#/components/schemas/ProcedureOutputInfo'
        poll:
          default: PT1S
          format: duration
          title: Poll
          type: string
        type:
          const: query
          default: query
          title: Type
      required:
      - name
      - method
      - live
      - arguments
      - output
      title: QueryBinding
      type: object
    RefreshInput:
      additionalProperties: false
