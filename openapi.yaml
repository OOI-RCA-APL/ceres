            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/BCryptHashingConfig'
          - $ref: '#/components/schemas/Argon2HashingConfig'
          title: Hashing
        hooks:
          $ref: '#/components/schemas/DatabaseConfigHooks'
        path:
          anyOf:
          - format: path
            type: string
          - type: 'null'
          title: Path
        retry:
          allOf:
          - $ref: '#/components/schemas/DatabaseRetryConfig'
