        host:
          default: 0.0.0.0
          title: Host
          type: string
        port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
        socket:
          anyOf:
          - format: path
            type: string
          - type: 'null'
          title: Socket
        ssl:
          anyOf:
          - $ref: '#/components/schemas/ServerSSLConfig'
