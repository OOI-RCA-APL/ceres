      type: string
    MessageOrder:
      enum:
      - old-to-new
      - new-to-old
      title: MessageOrder
      type: string
    Ok_Union_Any__NoneType__:
      additionalProperties: false
      properties:
        ok:
          const: true
          default: true
          title: Ok
        value:
          anyOf:
          - {}
          - type: 'null'
          title: Value
      required:
      - value
      title: Ok[Union[Any, NoneType]]
      type: object
    OrSchedule:
      additionalProperties: false
      properties:
        schedules:
          items:
            anyOf:
            - $ref: '#/components/schemas/CronSchedule'
            - $ref: '#/components/schemas/IntervalSchedule'
            - $ref: '#/components/schemas/OrSchedule'
          title: Schedules
          type: array
        type:
          const: or
          default: or
          title: Type
      required:
      - schedules
      title: OrSchedule
      type: object
    PostgresDatabaseConfig:
      additionalProperties: false
      properties:
        database:
          minLength: 1
          pattern: .*\S.*
          title: Database
          type: string
        engine:
