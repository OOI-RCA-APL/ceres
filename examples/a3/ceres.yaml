server:
  port: 9000
database:
  kind: sqlite
  path: ./data/database.sqlite
units:
  - name: a3
    components:
      - name: simulator
        class: ceres.projects.a3.A3Simulator
        args:
          host:
            port: 4000
          das:
            id: 2501
            port: 4001
            sampling_interval: 1m
            sampling_variable_interval: 8s
      - name: host-connection
        class: ceres.standard.TCPConnection
        args:
          host: 0.0.0.0
          port: 4000
          separator: "\n"
          disconnect_settings:
            idle: 1d
          reconnect_settings:
            interval: 1s
            backoff: 2
            max_interval: 15s
      - name: das-connection
        class: ceres.standard.TCPConnection
        args:
          host: 0.0.0.0
          port: 4001
          separator: "\n"
          disconnect_settings:
            idle: 15s
          reconnect_settings:
            interval: 1s
            backoff: 2
            max_interval: 15s
      - name: driver
        class: ceres.projects.a3.A3Driver
        args:
          host_connection: host-connection
          das_connection: das-connection
  - name: notifications
    components:
      - name: notifier
        class: ceres.standard.SMTPNotifier
        args:
          host: localhost
          port: 25
          sender: local@crabee.local
      - name: dispatcher
        class: ceres.standard.ScheduledDispatcher
        args:
          notifier: notifier
          writer:
            class: ceres.standard.HTMLDispatchWriter
          dispatches:
            - subject: Alerts
              description: Within the last 30 minutes, the following alerts were reported.
              schedule:
                kind: cron
                crontab: "* * * * *"
              alerts:
                within: 30m
                limit: 250
              recipients: [] # Add your email address here.
