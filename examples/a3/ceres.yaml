service:
  name: a3
server:
  port: 9000
database:
  kind: sqlite
  path: ./local/database.sqlite
components:
  - name: a3
    components:
      - name: simulator
        class: ceres.projects.a3.A3Simulator
        args:
          host:
            port: 4000
          das:
            id: 2501
            port: 4001
            sampling_interval: 1m
            sampling_variable_interval: 8s
      - name: host-connection
        class: ceres.standard.TCPConnection
        args:
          host: 0.0.0.0
          port: 4000
          separator: "\n"
          disconnect_settings:
            idle: 1d
      - name: das-connection
        class: ceres.standard.TCPConnection
        args:
          host: 0.0.0.0
          port: 4001
          separator: "\n"
          disconnect_settings:
            idle: 2m
      - name: driver
        class: ceres.projects.a3.A3Driver
        args:
          output: ./local/output
          host:
            connection: "@a3.host-connection"
          das:
            id: 2501
            connection: "@a3.das-connection"
  - name: notifications
    components:
      - name: notifier
        class: ceres.standard.SMTPNotifier
        args:
          host: localhost
          port: 25
          sender: local@crabee.local
      - name: dispatcher
        class: ceres.standard.ScheduledDispatcher
        args:
          notifier: "@notifications.notifier"
          writer:
            class: ceres.standard.HTMLDispatchWriter
          dispatches:
            - subject: Alerts
              description: Within the last 30 minutes, the following alerts were reported.
              schedule:
                kind: cron
                crontab: "* * * * *"
              alerts:
                within: 30m
                limit: 250
              recipients: [] # Add your email address here.
