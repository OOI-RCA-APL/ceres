# Minimal sensor example. Run with: ceres run all

service:
  name: sensor

server:
  port: 8080
  authentication:
    secret: secret

database:
  type: sqlite
  path: ./local/database.sqlite

logging:
  output: debug
  events: true

components:
  # The driver connects to a TCP sensor and parses readings into particles.
  - name: driver
    class: sensor.SensorDriver
    arguments:
      connection:
        source:
          class: ceres.connection.TCPSource
          arguments:
            host: localhost
            port: 4000

  # A simulator that mimics the sensor for local development.
  - name: simulator
    class: sensor.SensorSimulator
    arguments:
      port: 4000
      interval: 1s
