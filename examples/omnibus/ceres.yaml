# Service name, used for the SystemD/LaunchD service identifier.
service:
  name: omnibus

# HTTP server for the web console and REST API.
server:
  port: 8080
  authentication:
    secret: omnibus-example-secret

# SQLite database for storing messages, particles, logs, and alerts.
database:
  type: sqlite
  path: ./local/database.sqlite

# Log INFO and above to stdout, and log component lifecycle events.
logging:
  output: info
  events: true

components:
  # The main driver component. Connection transport sources are configured
  # here so the same driver class can be reused with different instruments
  # by changing the host/port.
  - name: omnibus
    class: driver.OmnibusDriver
    arguments:
      navigation:
        source:
          class: ceres.connection.TCPSource
          arguments:
            host: localhost
            port: 5100
      environment:
        source:
          class: ceres.connection.TCPSource
          arguments:
            host: localhost
            port: 5101
      output: ./local/data
      depth-limits:
        warning: 400
        critical: 450
      temperature-limits:
        low: 0
        high: 25
      health-check-interval: 30s

    # Pruners automatically delete old records on a cron schedule. Uncomment
    # to enable periodic cleanup.
    # pruners:
    #   - name: prune-old-logs
    #     prunes: log-entry
    #     schedule: "0 0 * * *"
    #     filter:
    #       max-age: 7d
    #   - name: prune-old-messages
    #     prunes: message
    #     schedule: "0 0 * * *"
    #     filter:
    #       max-age: 3d

  # TCP server simulators that mimic instrument feeds for local development.
  - name: navigation-simulator
    class: simulator.NavigationSimulator
    arguments:
      port: 5100
      interval: 1s

  - name: environment-simulator
    class: simulator.EnvironmentSimulator
    arguments:
      port: 5101
      interval: 2s
