server:
  port: 8080
database:
  type: sqlite
  path: ./local/database.sqlite
components:
  - name: connection
    class: ceres.standard.TCPConnection
    arguments:
      host: localhost
      port: 4000
      separator: "\n"
  - name: driver
    class: intro.driver.Driver
    arguments:
      connection: "@connection"
      out: ./local/messages.csv
