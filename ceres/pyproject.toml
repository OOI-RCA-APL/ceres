[tool.poetry]
name = "ceres"
version = "0.1.0"
description = ""
authors = ["Jake Ploskey <jploskey@uw.edu>"]
packages = [{ include = "ceres" }]

[tool.poetry.dependencies]
python = "^3.10"
aiosmtplib = "^1.1.0"
aiosqlite = { version = "^0.17.0", optional = true }
anyio = "^3.0.0"
apscheduler = "^3.9.0"
fastapi = "^0.67.0"
inflection = "^0.5.0"
psycopg = { version = "^3.1.0", extras = ["binary"], optional = true }
pydantic = "^1.10.0"
pyyaml = "^6.0"
sqlalchemy = "^2.0.0b2"
typer = { version = "^0.6.0", extras = ["all"] }
uvicorn = "^0.14.0"
uvloop = { version = "^0.16.0", optional = true }

[tool.poetry.extras]
postgres = ["psycopg"]
sqlite = ["aiosqlite"]
uvloop = ["uvloop"]
all = ["psycopg", "aiosqlite", "uvloop"]

[tool.poetry.dev-dependencies]
black = "^22.6.0"
flake8 = "^4.0.1"
isort = "^5.10.1"
mypy = "^0.971"
poethepoet = "^0.13.1"
pytest = "^7.1.3"
pytest-asyncio = "^0.19.0"
types-pyyaml = "^6.0.11"

[tool.poetry.scripts]
task = "poethepoet:main"
ceres = "ceres:main"

[tool.poe.tasks]
format = { shell = "isort . && black ." }
lint = { shell = "isort . --check --diff && black --check . && flake8 . && mypy ." }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.isort]
add_imports = ["from __future__ import annotations"]
multi_line_output = 3
profile = "black"

[tool.black]
line-length = 100

[tool.mypy]
disallow_any_generics = false
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
strict = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
