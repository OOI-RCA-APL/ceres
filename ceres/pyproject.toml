[tool.poetry]
name = "ceres"
version = "0.1.0"
description = ""
authors = ["Jake Ploskey <jploskey@uw.edu>"]
include = ["./ceres/**/*.py", "./ceres/static/**/*", "./ceres/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.8.0"
aiosmtplib = "^1.1.0"
apscheduler = "^3.9.0"
fastapi = ">=0.89.0"
fs = "^2.4.0"
pydantic = "^1.10.0"
pyyaml = "^6.0.0"
setproctitle = "^1.0.0"
sqlalchemy = "^2.0.0b3"
typer = { version = ">=0.6.0", extras = ["all"] }
uvicorn = ">=0.14.0"
watchfiles = ">=0.10.0"
websockets = "^10.0.0"

aiosqlite = { version = ">=0.17.0", optional = true }
psycopg = { version = "^3.1.0", extras = ["binary"], optional = true }
uvloop = { version = ">=0.17.0", optional = true }

[tool.poetry.extras]
postgres = ["psycopg"]
sqlite = ["aiosqlite"]
uvloop = ["uvloop"]
all = ["psycopg", "aiosqlite", "uvloop"]

[tool.poetry.dev-dependencies]
black = "^22.6.0"
isort = "^5.10.1"
pyright = "^1.1.278"
pytest = "^7.1.3"
pytest-asyncio = "^0.19.0"
types-pyyaml = "^6.0.11"

[tool.poetry.scripts]
ceres = "ceres:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.isort]
multi_line_output = 3
profile = "black"

[tool.black]
line-length = 100

[tool.pyright]
include = ["ceres", "tests"]
reportImportCycles = false
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnnecessaryIsInstance = false
reportUntypedFunctionDecorator = false
reportUnusedFunction = false
typeCheckingMode = "strict"
useLibraryCodeForTypes = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
