services:
  postgres:
    image: postgres:15
    # image: ghcr.io/hydradatabase/hydra:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceres
      POSTGRES_PASSWORD: ceres
      POSTGRES_DB: ceres
    ports:
      - "5432:5432"
    volumes:
      - ceres-postgres:/var/lib/postgresql/data
volumes:
  ceres-postgres:
    name: ceres-postgres
