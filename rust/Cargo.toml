[workspace]
resolver = "3"
members = [
    "ceres-binary",
    "ceres-cli",
    "ceres-config",
    "ceres-core",
    "ceres-database",
    "ceres-entities",
    "ceres-macros",
    "ceres-stubs",
]

# The extension module builds through maturin and as `ceres-stubs`'s build dependency. Leaving
# it out of the default set keeps those the only builds, because a third one in the same
# invocation collides with the build-dependency copy on identical output filenames.
default-members = [
    "ceres-binary",
    "ceres-cli",
    "ceres-config",
    "ceres-database",
    "ceres-entities",
    "ceres-macros",
    "ceres-stubs",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jploskey/ceres"

[workspace.lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
