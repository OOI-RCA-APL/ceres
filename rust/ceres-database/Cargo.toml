[package]
name = "ceres-database"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
# The backend trait has async methods and is held behind `dyn`, which the language cannot
# express on its own until async fns in traits become dyn-compatible.
async-trait = "0.1"
bcrypt = { version = "0.19", default-features = false, features = ["std"] }
ceres-entities = { path = "../ceres-entities" }
chrono = "0.4"
csv = "1"
email_address = { version = "0.2", default-features = false }
idna = "1"
include_dir = "0.7"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
serde_path_to_error = "0.1"
sea-query = { version = "0.32", features = [
    # Statements cross await points, so the reference counting inside them has to be atomic.
    "thread-safe",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
serde = "1"
serde_json = "1"
yaml_serde = "0.10"
speedate = "0.17.0"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "postgres",
    "runtime-tokio",
    "sqlite",
    "uuid",
] }
thiserror = "2"
unicode-normalization = "0.1"
# Sync primitives only, the runtime itself comes through the caller's executor. Turso's
# default features are off because they register a global mimalloc allocator, which a
# library must never impose on its host process.
tokio = { version = "1", default-features = false, features = ["sync"] }
turso = { version = "0.7.1", default-features = false }
uuid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
