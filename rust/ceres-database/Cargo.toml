[package]
name = "ceres-database"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ceres-entities = { path = "../ceres-entities" }
chrono = "0.4"
sea-query = { version = "0.32", features = [
    "with-chrono",
    "with-json",
    "with-uuid",
] }
sea-query-binder = { version = "0.7", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "json",
    "postgres",
    "runtime-tokio",
    "sqlite",
    "uuid",
] }
thiserror = "2"
# Sync primitives only, the runtime itself comes through the caller's executor. Turso's
# default features are off because they register a global mimalloc allocator, which a
# library must never impose on its host process.
tokio = { version = "1", default-features = false, features = ["sync"] }
turso = { version = "0.7.1", default-features = false }
uuid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
