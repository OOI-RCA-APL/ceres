[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "ceres-core"
version = "0.40.0"
description = "Native core for Ceres"
requires-python = ">=3.14"

[tool.maturin]
module-name = "ceres_core"
features = ["extension-module"]

# Rebuild when the Rust sources change, not only when the packaging files do.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "ceres_core.pyi" },
    { file = "src/**/*.rs" },
    { file = "../ceres-config/Cargo.toml" },
    { file = "../ceres-config/src/**/*.rs" },
]
