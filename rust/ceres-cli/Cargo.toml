# The crate version is a placeholder. The binary reports the Ceres package version, which
# build.rs reads from pyproject.toml at the repository root.
[package]
name = "ceres-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native command line interface for Ceres"

[[bin]]
name = "ceres"
path = "src/main.rs"

[dependencies]
ceres-config = { path = "../ceres-config" }
ceres-database = { path = "../ceres-database" }
ceres-entities = { path = "../ceres-entities" }
# Only for the OpenAPI document, so `generate openapi` renders the same schema the
# running server serves.
ceres-server = { path = "../ceres-server" }
# A dump colors the two kinds of string worth telling apart at a glance by handing them to
# the parsers that own those formats, rather than by matching their shape.
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
# `string` lets an argument be named at runtime, which the table commands are, their
# whole surface being generated from the entity definitions.
rpassword = "7"
clap = { version = "4.5", features = ["derive", "string", "suggestions", "wrap_help"] }
dotenvy = "0.15"
mimalloc = "0.1"
# The resident `run` parent owns child processes, exit signals, and restart timing, so
# the runtime carries those drivers beside the executor.
tokio = { version = "1", default-features = false, features = [
    "macros",
    "process",
    "rt",
    "signal",
    "time",
] }
# Watch mode restarts the engine on source edits.
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
sha1 = "0.10"
# `generate certificate` signs with an ECDSA P-256 key and prints the SHA-256
# fingerprint of what it wrote.
rcgen = "0.14"
sha2 = "0.10"
time = "0.3"
# `generate certificate` writes beside the targets and renames over them, the key file
# owner-only from creation.
tempfile = "3"
ureq = { version = "3", features = ["json"] }
plist = "1"
regex-lite = "0.1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The end-to-end tests build a real database for the binary to work against, which is
# the only way to see what a command actually did to the rows.
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
