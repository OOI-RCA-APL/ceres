[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
# The distribution is `ceres-engine` because the bare name belongs to another PyPI
# project, while the import package stays `ceres`. The release workflow also builds a
# `ceres` alias wheel, one pure-Python shim pinning this distribution, so the bare name
# resolves from the project's own package index.
name = "ceres-engine"
version = "0.42.0"
description = "A Python framework for data collection, monitoring and device control."
# The documentation home page doubles as the rendered description on PyPI, which is why its
# links and images are absolute rather than relative to the repository.
readme = "docs/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jake Ploskey", email = "jploskey@uw.edu" }]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1,<6",
    "anyio>=4.13,<5",
    "apscheduler>=3.11.2,<4",
    "asgiref>=3.11.1,<4",
    "jinja2>=3.1,<4",
    "mistune>=3.2,<4",
    "objsize>=0.8.0",
    "pydantic-extra-types>=2.11,<3",
    "pydantic-settings>=2.13.1,<3",
    "pydantic>=2.12.5,<3",
    "pyjwt>=2.11,<3",
    "pyyaml>=6,<7",
    "rich>=14.3.2,<15",
    "setproctitle>=1.3.7,<2",
    "typing-extensions>=4.15.0",
    "uuid-utils>=0.14.1",
    "uvloop>=0.22.1; platform_system == 'Linux' or platform_system == 'Darwin'",
    "watchfiles>=1.1.1,<2",
    "starlette>=1,<2",
]

[project.urls]
Documentation = "https://ooi-rca-apl.github.io/ceres/"
Source = "https://github.com/OOI-RCA-APL/ceres"
Changelog = "https://github.com/OOI-RCA-APL/ceres/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright==1.1.408",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8,<4",
    "ruff==0.15",
    "types-pyyaml>=6,<7",
]
docs = [
    "griffe==1.5.1",
    "mike>=2.1,<3",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings-python>=1.12,<2",
    "black>=24.10,<25",
]

# The native core ships inside this distribution as `ceres.__internal__.core` rather
# than as a separate package, so there is one artifact to build and install rather than
# two that have to agree on a version. The Rust crate keeps its own name, only the
# Python module it lands as is renamed.
#
# The native `ceres` command ships in the same wheel through maturin's data-directory
# convention. Building the extension builds the CLI binary as an artifact dependency, and
# `ceres-core`'s build script stages it in `ceres.__internal__.core.data/scripts/`, which
# maturin picks up by name and installers unpack onto the environment's `bin`. Maturin
# only honors the directory when it exists before the build starts, so `make build` and
# the release workflow create it up front, and the sdist ships a `.keep` marker inside so
# extraction creates it there too. The directory is deliberately not configured with the
# `data` option, because a configured directory that is missing fails the build outright,
# while the conventional one is skipped silently.
[tool.maturin]
module-name = "ceres.__internal__.core"
manifest-path = "rust/ceres-core/Cargo.toml"
python-source = "."
features = ["extension-module"]
# Data files the package reads at runtime, which are not Python and so are not picked up
# by following the module tree. Migrations are the one that fails only once installed.
#
# The sdist entries make source installs equivalent to our own builds. The toolchain and
# cargo config files pin the nightly and enable the unstable features the build relies on
# (`bindeps`, `build-dir`) along with the SQLite math functions and the macOS linker
# arguments. The `.keep` marker exists so extracting the sdist creates the wheel data
# directory, which maturin requires before the build starts, and `ceres-core`'s build
# script removes it while staging the CLI binary in its place.
include = [
    { path = "ceres/py.typed", format = "wheel" },
    { path = "ceres/static/**/*", format = "wheel" },
    { path = "ceres/database/migrations/*.sql", format = "wheel" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "ceres.__internal__.core.data/scripts/.keep", format = "sdist" },
]

# Rebuild when the Rust sources change, not only when the packaging files do.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/ceres-core/Cargo.toml" },
    { file = "rust/ceres-core/src/**/*.rs" },
    { file = "rust/ceres-config/Cargo.toml" },
    { file = "rust/ceres-config/src/**/*.rs" },
    { file = "ceres/__internal__/core.pyi" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F402", "UP022", "UP040"]
extend-select = ["I", "TC", "T201", "UP"]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions", "collections.abc"]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "ceres.component.Component",
    "ceres.data.DataModel",
    "ceres.data.ImmutableDataModel",
    "ceres.data.DataObject",
    "ceres.data.FrozenDataObject",
    "ceres.ParticleData",
    "ceres.particle.ParticleData",
    "ceres.error.Error",
    "ceres.server.Server",
    "ceres.__internal__.cli.shared.CLICommand",
    "ceres.__internal__.cli.shared.CLICommandGroup",
    "ceres.__internal__.entity.BaseEntity",
    "ceres.__internal__.entity.BaseEntityCreate",
    "ceres.__internal__.entity.BaseEntityFilter",
    "ceres.__internal__.entity.BaseEntityFilterArgs",
    "ceres.__internal__.entity.BaseUUIDEntity",
    "ceres.__internal__.entity.BaseUUIDEntityCreate",
    "ceres.__internal__.entity.BaseUUIDEntityFilter",
    "ceres.__internal__.entity.BaseUUIDEntityFilterArgs",
    "ceres.__internal__.record.BaseRecord",
    "ceres.__internal__.record.BaseRecordCreate",
    "ceres.__internal__.record.BaseRecordFilter",
    "ceres.__internal__.record.BaseRecordFilterArgs",
]
runtime-evaluated-decorators = [
    "ceres.__internal__.app.shared.Router.delete",
    "ceres.__internal__.app.shared.Router.get",
    "ceres.__internal__.app.shared.Router.patch",
    "ceres.__internal__.app.shared.Router.post",
    "ceres.__internal__.app.shared.Router.put",
    "pydantic.validate_call",
    "pydantic.model_serializer",
    "pydantic.field_serializer",
    "ceres.component.action",
    "ceres.component.query",
]

[tool.pyright]
include = ["ceres", "tests"]
# The native core's stubs are generated from the Rust definitions, so they answer to the
# generator rather than to the rules hand-written code is held to.
exclude = ["rust", "ceres/__internal__/core.pyi"]
typeCheckingMode = "standard"
reportImplicitOverride = true
reportIncompatibleVariableOverride = false
reportMatchNotExhaustive = true
reportRedeclaration = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]
addopts = ["-vvv", "-s"]

[tool.coverage.run]
source = ["ceres"]
omit = [
    "ceres/__internal__/app/*",
    "ceres/__internal__/cli/*",
    "ceres/static/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@override",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
