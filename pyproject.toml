[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceres"
version = "0.37.0"
description = "APL - Ceres"
authors = [{ name = "Jake Ploskey", email = "jploskey@uw.edu" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3,<4",
    "aiosmtplib>=5.1,<6",
    "aiosqlite>=0.22.1",
    "anyio>=4.12.1,<5",
    "apscheduler>=3.11.2,<4",
    "argon2-cffi>=25.1",
    "asgiref>=3.11.1,<4",
    "asyncpg>=0.31",
    "bcrypt>=5,<6",
    "email-validator>=2.1,<3",
    "fastapi>=0.128.3",
    "granian>=2.7,<3",
    "jinja2>=3.1,<4",
    "mistune>=3.2,<4",
    "pydantic-extra-types>=2.11,<3",
    "pydantic-settings>=2.12,<3",
    "pydantic>=2.12.5,<3",
    "pyjwt>=2.11,<3",
    "pyyaml>=6,<7",
    "rich>=14.3.2,<15",
    "setproctitle>=1.3.7,<2",
    "sqlalchemy[asyncio]>=2.0.46,<3",
    "starlette-compress>=1.7,<2",
    "starlette>=0.52.1",
    "typing-extensions>=4.15.0",
    "uuid-utils>=0.14",
    "uvloop>=0.22.1; platform_system == 'Linux' or platform_system == 'Darwin'",
    "watchfiles>=1.1.1,<2",
]

[dependency-groups]
dev = [
    "pyright==1.1.380",
    "pytest==7.4.0",
    "pytest-asyncio==0.21.1",
    "ruff==0.15",
    "types-pyyaml>=6,<7",
]
docs = [
    "griffe==1.5.1",
    "mike>=2.1,<3",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings-python>=1.12,<2",
    "black>=24.10,<25",
]

[project.scripts]
ceres = "ceres._internal.cli.main:main"

[tool.hatch.build]
packages = ["ceres"]
include = ["./ceres/**/*.py", "./ceres/py.typed", "./ceres/static/"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F402", "UP022", "UP040"]
extend-select = ["I", "TC", "T201", "UP"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "ceres.component.Component",
    "ceres.data.DataModel",
    "ceres.data.ImmutableDataModel",
    "ceres.data.DataObject",
    "ceres.data.FrozenDataObject",
    "ceres.server.Server",
    "ceres._internal.cli.shared.CLICommand",
    "ceres._internal.cli.shared.CLICommandGroup",
    "ceres._internal.entity.BaseEntity",
    "ceres._internal.entity.BaseEntityCreate",
    "ceres._internal.entity.BaseEntityFilter",
    "ceres._internal.entity.BaseEntityFilterArgs",
    "ceres._internal.entity.BaseEntityRow",
    "ceres._internal.entity.BaseUUIDEntity",
    "ceres._internal.entity.BaseUUIDEntityCreate",
    "ceres._internal.entity.BaseUUIDEntityFilter",
    "ceres._internal.entity.BaseUUIDEntityFilterArgs",
    "ceres._internal.entity.BaseUUIDEntityRow",
    "ceres._internal.record.BaseRecord",
    "ceres._internal.record.BaseRecordCreate",
    "ceres._internal.record.BaseRecordFilter",
    "ceres._internal.record.BaseRecordFilterArgs",
    "ceres._internal.record.BaseRecordRow",
]
runtime-evaluated-decorators = [
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "pydantic.validate_call",
    "ceres.component.action",
    "ceres.component.query",
]

[tool.pyright]
include = ["ceres", "tests"]
typeCheckingMode = "standard"
reportImplicitOverride = true
reportIncompatibleVariableOverride = false
reportMatchNotExhaustive = true
reportRedeclaration = false
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]
addopts = ["-vvv", "-s"]
