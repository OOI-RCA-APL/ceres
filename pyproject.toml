[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceres"
version = "0.40.0"
description = "APL - Ceres"
authors = [{ name = "Jake Ploskey", email = "jploskey@uw.edu" }]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3,<4",
    "ceres-core==0.40.0",
    "aiosmtplib>=5.1,<6",
    "aiosqlite>=0.22.1",
    "anyio>=4.13,<5",
    "apscheduler>=3.11.2,<4",
    "argon2-cffi>=25.1",
    "asgiref>=3.11.1,<4",
    "asyncpg>=0.31",
    "bcrypt>=5,<6",
    "email-validator>=2.1,<3",
    "fastapi>=0.135.2",
    "granian>=2.7,<3",
    "jinja2>=3.1,<4",
    "mistune>=3.2,<4",
    "objsize>=0.8.0",
    "pydantic-extra-types>=2.11,<3",
    "pydantic-settings>=2.13.1,<3",
    "pydantic>=2.12.5,<3",
    "pyjwt>=2.11,<3",
    "pyyaml>=6,<7",
    "rich>=14.3.2,<15",
    "setproctitle>=1.3.7,<2",
    "sqlalchemy[asyncio]>=2.0.46,<3",
    "starlette-compress>=1.7,<2",
    "starlette>=1,<2",
    "typing-extensions>=4.15.0",
    "uuid-utils>=0.14.1",
    "uvloop>=0.22.1; platform_system == 'Linux' or platform_system == 'Darwin'",
    "watchfiles>=1.1.1,<2",
]

[project.optional-dependencies]
# Consider making required once free-threaded support lands for `pyturso`.
turso = ["pyturso>=0.7.1"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright==1.1.408",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0",
    "pyturso>=0.7.1",
    "ruff==0.15",
    "types-pyyaml>=6,<7",
]
docs = [
    "griffe==1.5.1",
    "mike>=2.1,<3",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings-python>=1.12,<2",
    "black>=24.10,<25",
]

[project.scripts]
ceres = "ceres.__internal__.cli.main:main"

[tool.hatch.build]
packages = ["ceres"]
include = ["./ceres/**/*.py", "./ceres/py.typed", "./ceres/static/", "./ceres/database/migrations/*.sql"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
ceres-core = { path = "rust/ceres-core" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F402", "UP022", "UP040"]
extend-select = ["I", "TC", "T201", "UP"]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions", "fastapi", "collections.abc"]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "ceres.component.Component",
    "ceres.data.DataModel",
    "ceres.data.ImmutableDataModel",
    "ceres.data.DataObject",
    "ceres.data.FrozenDataObject",
    "ceres.error.Error",
    "ceres.server.Server",
    "ceres.__internal__.cli.shared.CLICommand",
    "ceres.__internal__.cli.shared.CLICommandGroup",
    "ceres.__internal__.entity.BaseEntity",
    "ceres.__internal__.entity.BaseEntityCreate",
    "ceres.__internal__.entity.BaseEntityFilter",
    "ceres.__internal__.entity.BaseEntityFilterArgs",
    "ceres.__internal__.entity.BaseEntityRow",
    "ceres.__internal__.entity.BaseUUIDEntity",
    "ceres.__internal__.entity.BaseUUIDEntityCreate",
    "ceres.__internal__.entity.BaseUUIDEntityFilter",
    "ceres.__internal__.entity.BaseUUIDEntityFilterArgs",
    "ceres.__internal__.entity.BaseUUIDEntityRow",
    "ceres.__internal__.record.BaseRecord",
    "ceres.__internal__.record.BaseRecordCreate",
    "ceres.__internal__.record.BaseRecordFilter",
    "ceres.__internal__.record.BaseRecordFilterArgs",
    "ceres.__internal__.record.BaseRecordRow",
]
runtime-evaluated-decorators = [
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "ceres.__internal__.app.shared.Router.delete",
    "ceres.__internal__.app.shared.Router.get",
    "ceres.__internal__.app.shared.Router.patch",
    "ceres.__internal__.app.shared.Router.post",
    "ceres.__internal__.app.shared.Router.put",
    "pydantic.validate_call",
    "pydantic.model_serializer",
    "pydantic.field_serializer",
    "ceres.component.action",
    "ceres.component.query",
]

[tool.pyright]
include = ["ceres", "tests"]
exclude = ["rust"]
typeCheckingMode = "standard"
reportImplicitOverride = true
reportIncompatibleVariableOverride = false
reportMatchNotExhaustive = true
reportRedeclaration = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]
addopts = ["-vvv", "-s"]

[tool.coverage.run]
source = ["ceres"]
omit = [
    "ceres/__internal__/app/*",
    "ceres/__internal__/cli/*",
    "ceres/static/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@override",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
