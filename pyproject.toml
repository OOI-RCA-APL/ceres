[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceres"
version = "0.15.0"
description = "APL - Ceres"
authors = [{ name = "Jake Ploskey", email = "jploskey@uw.edu" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp~=3.11.0",
    "aiosmtplib~=1.1.0",
    "aiosqlite>=0.20.0",
    "anyio~=4.0.0",
    "apscheduler~=3.9.0",
    "argon2-cffi~=23.1.0",
    "asgiref~=3.7.0",
    "asyncpg>=0.29.0",
    "bcrypt~=4.1.0",
    "email-validator~=2.1.0",
    "fastapi~=0.115.0",
    "humanize~=4.9.0",
    "hypercorn>=0.17.3",
    "jinja2~=3.1.0",
    "launchd~=0.3.0; platform_system == 'Darwin'",
    "mistune~=3.0.0",
    "pydantic-extra-types~=2.8.0",
    "pydantic~=2.10.0",
    "pyjwt~=2.8.0",
    "pyyaml~=6.0.0",
    "setproctitle~=1.3.0",
    "sqlalchemy[asyncio]~=2.0.0",
    "sqlparse>=0.4.0",
    "starlette-compress~=1.2.0",
    "typer>=0.6.0",
    "uvloop>=0.17.0",
    "watchfiles>=0.10.0",
    "websockets~=10.0.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.380",
    "pytest==7.4.0",
    "pytest-asyncio==0.21.1",
    "ruff==0.4.9",
    "types-pyyaml~=6.0.0",
]
docs = [
    "griffe==1.5.1",
    "mike~=2.1.3",
    "mkdocs-material~=9.5.44",
    "mkdocstrings-python~=1.12.2",
    "black~=24.10.0",
]

[project.scripts]
ceres = "ceres._internal.cli.main:main"

[tool.hatch.build]
packages = ["ceres"]
include = ["./ceres/**/*.py", "./ceres/py.typed", "./ceres/static/"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F402"]
extend-select = ["I"]

[tool.pyright]
include = ["ceres", "tests"]
reportImplicitOverride = true
reportIncompatibleVariableOverride = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnnecessaryIsInstance = false
reportUntypedFunctionDecorator = false
reportUnusedFunction = false
typeCheckingMode = "strict"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = "ignore:.*pkg_resources.*:DeprecationWarning"
