[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceres"
version = "0.29.1"
description = "APL - Ceres"
authors = [{ name = "Jake Ploskey", email = "jploskey@uw.edu" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp~=3.11",
    "aiosmtplib~=1.1",
    "aiosqlite>=0.20",
    "anyio~=4.8",
    "apscheduler~=3.11",
    "argon2-cffi~=23.1",
    "asgiref~=3.7",
    "asyncpg>=0.29",
    "bcrypt~=4.1",
    "email-validator~=2.1",
    "fastapi>=0.115",
    "granian~=2.1",
    "humanize~=4.9",
    "jinja2~=3.1",
    "mistune~=3.0",
    "pydantic-extra-types~=2.8",
    "pydantic-settings~=2.8",
    "pydantic~=2.11",
    "pyjwt~=2.8",
    "pyyaml~=6.0",
    "rich~=13.9",
    "setproctitle~=1.3",
    "sqlalchemy[asyncio]~=2.0",
    "sqlparse>=0.4",
    "starlette-compress~=1.2",
    "uuid-utils>=0.10.0",
    "uvloop>=0.17; platform_system == 'Linux' or platform_system == 'Darwin'",
    "watchfiles>=0.10",
    "websockets~=10.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.380",
    "pytest==7.4.0",
    "pytest-asyncio==0.21.1",
    "ruff==0.8.1",
    "types-pyyaml~=6.0",
]
docs = [
    "griffe==1.5.1",
    "mike~=2.1",
    "mkdocs-material~=9.5",
    "mkdocstrings-python~=1.12",
    "black~=24.10",
]

[project.scripts]
ceres = "ceres._internal.cli.main:main"

[tool.hatch.build]
packages = ["ceres"]
include = ["./ceres/**/*.py", "./ceres/py.typed", "./ceres/static/"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F402"]
extend-select = ["I"]

[tool.pyright]
include = ["ceres", "tests"]
reportImplicitOverride = true
reportIncompatibleVariableOverride = false
reportMatchNotExhaustive = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
