[tool.poetry]
name = "ceres"
version = "0.5.0"
description = "APL - Ceres"
authors = ["Jake Ploskey <jploskey@uw.edu>"]
include = ["./ceres/**/*.py", "./ceres/static/**/*", "./ceres/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.8.0"
aiosmtplib = "^1.1.0"
aiosqlite = ">=0.17.0"
aiotools = "^1.7.0"
anyio = "^4.0.0"
apscheduler = "^3.9.0"
asgiref = "^3.7.0"
asyncpg = "^0.28.0"
fastapi = ">=0.101.1"
jinja2 = "^3.1.0"
mistune = ">=3.0.0rc5"
psycopg = { version = "^3.1.0", extras = ["binary"] }
pydantic = "^2.1.0"
pydantic-extra-types = "^2.0.0"
pyyaml = "^6.0.0"
setproctitle = "^1.0.0"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
sqlparse = ">=0.4.0"
typer = { version = ">=0.6.0", extras = ["all"] }
uvicorn = ">=0.14.0"
uvloop = ">=0.17.0"
watchfiles = ">=0.10.0"
websockets = "^10.0.0"

backports-strenum = { version = "^1.2.0", python = "<3.11" }

launchd = { version = "0.3.0", platform = "darwin" }

[tool.poetry.group.dev.dependencies]
black = "23.7.0"
pyright = "1.1.324"
pytest = "7.4.0"
pytest-asyncio = "0.21.1"
ruff = "0.0.286"
types-pyyaml = "^6.0.12.11"

[tool.poetry.scripts]
ceres = "ceres:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
ignore = ["F402"]

[tool.pyright]
include = ["ceres", "tests"]
reportImportCycles = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnnecessaryIsInstance = false
reportUntypedFunctionDecorator = false
reportUnusedFunction = false
typeCheckingMode = "strict"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = "ignore:.*pkg_resources.*:DeprecationWarning"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
